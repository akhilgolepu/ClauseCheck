name: clausecheck

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: clausecheck
      POSTGRES_PASSWORD: clausecheck
      POSTGRES_DB: clausecheck
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clausecheck -d clausecheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://clausecheck:clausecheck@db:5432/clausecheck
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
